name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package skill
        run: |
          cd ..
          zip -r lehrer.skill lehrer/ \
            --exclude "lehrer/.git*" \
            --exclude "lehrer/.github*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ../lehrer.skill
          generate_release_notes: true
