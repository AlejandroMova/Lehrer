name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package skill
        run: |
          mkdir -p /tmp/lehrer
          cp -r SKILL.md README.md references/ examples/ assets/ /tmp/lehrer/
          cd /tmp
          zip -r lehrer.skill lehrer/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/lehrer.skill
          generate_release_notes: true
